name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  live-translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sox and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-fmt-all shellcheck
      - name: Run test suite (segmentation, pipeline with stub whisper, cleanup, installer dry-run)
        run: bash live-translate/tests/run.sh
