# Live Translate - Hyprland drop-in (legacy windowrulev2 syntax; Hyprland < 0.53)
# Installed to ~/.config/hypr/live-translate.conf and sourced from hyprland.conf.
# install.sh substitutes the absolute path of continuous_translate.sh below.

windowrulev2 = float, title:^(Live Translate)$
windowrulev2 = pin, title:^(Live Translate)$
windowrulev2 = size 450 350, title:^(Live Translate)$
windowrulev2 = move 100%-470 50, title:^(Live Translate)$

# Toggle the pipeline (opens the window, or stops the running one).
bind = SUPER SHIFT, T, exec, @@SCRIPT@@ toggle
