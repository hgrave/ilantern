# Live Translate - Hyprland drop-in (Hyprland >= 0.53 syntax; Omarchy 3.x)
# Installed to ~/.config/hypr/live-translate.conf and sourced from hyprland.conf.
# install.sh substitutes the absolute path of continuous_translate.sh below.

windowrule = float on, match:title ^(Live Translate)$
windowrule = pin on, match:title ^(Live Translate)$
windowrule = size 450 350, match:title ^(Live Translate)$
windowrule = move 100%-470 50, match:title ^(Live Translate)$

# Toggle the pipeline (opens the window, or stops the running one).
bindd = SUPER SHIFT, T, Live Translate, exec, @@SCRIPT@@ toggle
