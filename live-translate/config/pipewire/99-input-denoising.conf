# RNNoise noise suppression for the microphone (PipeWire filter-chain).
# Package: noise-suppression-for-voice (Arch: extra). Plugin: /usr/lib/ladspa/librnnoise_ladspa.so
# Install to: ~/.config/pipewire/pipewire.conf.d/99-input-denoising.conf
# then:       systemctl --user restart pipewire pipewire-pulse wireplumber
#
# Creates a virtual source "rnnoise_source" ("Noise Canceling source") fed from the
# default microphone. continuous_translate.sh picks it automatically when present.
# To make it the default for every app (Meet, Zoom, ...):
#   wpctl set-default $(wpctl status | awk '/rnnoise_source|Noise Canceling source/{gsub(/\./,"",$2); print $2; exit}')

context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Noise Canceling source"
      media.name       = "Noise Canceling source"
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label  = noise_suppressor_mono
            control = {
              # Probability (%) that a frame must be voice to pass. 50 is a good
              # default for continuous speech; raise toward 85-95 to reject more
              # room echo / keyboard noise at the risk of clipping soft syllables.
              "VAD Threshold (%)" = 50.0
              # Keep passing audio this long after voice stops (avoids chopped word endings).
              "VAD Grace Period (ms)" = 200
              # Look-back so the first phoneme of a word is not clipped (adds latency).
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name    = "capture.rnnoise_source"
        node.passive = true
        audio.rate   = 48000
      }
      playback.props = {
        node.name    = "rnnoise_source"
        media.class  = Audio/Source
        audio.rate   = 48000
      }
    }
  }
]
